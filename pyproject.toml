    "google-genai>=1.0",
    "flagembedding>=1.2",
]

[project.scripts]
seo-rank = "seo_rank.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/unit"]
markers = [
  "integration: live provider smoke tests skipped unless explicitly enabled",
]
