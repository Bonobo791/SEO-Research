[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-rank"
version = "0.2.0"
description = "Offline-first SEO ranking similarity CLI scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyarrow>=21.0",
  "polars>=1.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
similarity = [
    "google-genai>=1.0",
    "flagembedding>=1.2",
]

[project.scripts]
seo-rank = "seo_rank.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/unit"]
markers = [
  "integration: live provider smoke tests skipped unless explicitly enabled",
]
